# ========================================================
#            ESCore - Messages Configuration
# ========================================================

# The global prefix for all ESCore messages.
# Configured with the server branding and classic arrow separator.
prefix: "&#33A2FF&lC&#29ACFF&lO&#1EB6FF&lR&#14BFFF&lE &#0AC9FF&lS&#00D3FF&lM&#00E5FF&lP&r &8▶ "

# General Messages
no-permission: "{PREFIX}&cYou do not have permission to execute this command."
player-only: "{PREFIX}&cThis command can only be executed by players."
player-not-found: "{PREFIX}&cPlayer &e{PLAYER} &cnot found."
reload-success: "{PREFIX}&aConfiguration files and systems reloaded successfully."

# ESCore Core Command Messages
core:
  header: "&8----------------------------------------"
  version: "&7Version: &ev1.0"
  author: "&7Author: &eAKHILPLAYZYT"
  features: "&7Features: &fCoins &8| &fClearLag &8| &fSpawn &8| &fArena Regen &8| &fCosmetics"
  cmd-reload: "&e/escore reload &7- Reload all configurations"
  cmd-coins: "&e/coins &7- Manage and view premium coins"
  cmd-clearlag: "&e/clearlag &7- Manage entity cleanup system"
  cmd-spawn: "&e/spawn &7- Teleport to server spawn"
  cmd-setspawn: "&e/setspawn &7- Set server spawn location"
  cmd-arena: "&e/arena regen &7- Arena regeneration system"
  cmd-give: "&e/escore give <player> <glow|chatcolor> <value> <perm|temp [duration]>"
  cmd-remove: "&e/escore remove <player> <glow|chatcolor>"
  cmd-glow: "&e/glow <on|off> &7- Toggle player glow"
  cmd-chatcolor: "&e/chatcolor <on|off> &7- Toggle chat color"
  cmd-cc: "&e/cc &7- Chat color cosmetic shortcuts"
  cmd-update: "&e/escore update <check|status> &7- BuiltByBit update checker"
  footer: "&8----------------------------------------"

# ESCore Unified Give Command Hints
escore:
  give:
    usage: "{PREFIX}&cUsage: /escore give <player> <feature> <value> <duration>\n&7Next argument: &e<player> &7(Online or offline player name)"
    hint-feature: "{PREFIX}&cUsage: /escore give {PLAYER} <feature> <value> <duration>\n&7Next argument: &e<feature> &7(Options: &aglow&7, &achatcolor&7)"
    invalid-feature: "{PREFIX}&cInvalid feature '&e{FEATURE}&c'. Valid features: &aglow&c, &achatcolor&c."
    hint-glow: "{PREFIX}&cUsage: /escore give {PLAYER} glow <color> <duration>\n&7Next argument: &e<color> &7(Available glow colors: &f{COLORS}&7)"
    hint-chatcolor: "{PREFIX}&cUsage: /escore give {PLAYER} chatcolor <color> <duration>\n&7Next argument: &e<color> &7(Available chat colors: &f{COLORS}&7)"
    hint-duration-type: "{PREFIX}&cUsage: /escore give {PLAYER} {FEATURE} {VALUE} <duration>\n&7Next argument: &e<duration> &7(Options: &aperm &7or &atemp <duration>&7)"
    hint-duration-value: "{PREFIX}&cUsage: /escore give {PLAYER} {FEATURE} {VALUE} temp <duration>\n&7Next argument: &e<duration> &7(Examples: &a1h&7, &a12h&7, &a1d&7, &a5d&7, &a7d&7, &a30d&7)"

# First Join Welcome Announcement
first-join: "&c❤ &fWelcome &c{PLAYER} &fto &#FF3366&lSERVER&f! &7[&#FF3366#{COUNT}&7]"

# Death Messages System
death-messages:
  player: "&7☠ &c{VICTIM} &7was defeated by &a{KILLER}"
  explosion: "&7☠ &c{VICTIM} &7was defeated by &aan Explosion"
  mob: "&7☠ &c{VICTIM} &7was defeated by &a{KILLER}"
  fall: "&7☠ &c{VICTIM} &7hit the ground too hard"
  void: "&7☠ &c{VICTIM} &7fell into the &aVoid"
  lava: "&7☠ &c{VICTIM} &7tried to swim in &aLava"
  fire: "&7☠ &c{VICTIM} &7went up in &aFlames"
  drowning: "&7☠ &c{VICTIM} &7drowned"
  magic: "&7☠ &c{VICTIM} &7was defeated by &aMagic"
  wither: "&7☠ &c{VICTIM} &7withered away"
  starvation: "&7☠ &c{VICTIM} &7starved to death"
  suffocation: "&7☠ &c{VICTIM} &7suffocated in a wall"
  lightning: "&7☠ &c{VICTIM} &7was struck by lightning"
  default: "&7☠ &c{VICTIM} &7was defeated by &a{CAUSE}"

# Spawn System Messages
spawn:
  not-set: "{PREFIX}&cSpawn location has not been set yet."
  set-success: "{PREFIX}&aServer spawn location has been set to your current position."
  teleport-countdown: "{PREFIX}&7Teleporting in &e{TIME}&7 seconds... Don't move!"
  teleport-cancelled: "{PREFIX}&cTeleport cancelled because you moved!"
  teleport-success: "{PREFIX}&aTeleported to spawn!"
  already-teleporting: "{PREFIX}&cYou already have a pending teleport in progress."

# Coin Economy Messages
coins:
  balance: "{PREFIX}&7You have &e{BALANCE} Coins&7."
  balance-other: "{PREFIX}&e{PLAYER} &7has &e{BALANCE} Coins&7."

  pay:
    sender: "{PREFIX}&7You sent &e{AMOUNT} Coins &7to &e{PLAYER}&7."
    receiver: "{PREFIX}&7You received &e{AMOUNT} Coins &7from &e{PLAYER}&7."

  insufficient: "{PREFIX}&cYou don't have enough Coins."
  invalid-amount: "{PREFIX}&cEnter a valid amount."
  self-payment: "{PREFIX}&cYou cannot send Coins to yourself."

  give: "{PREFIX}&aAdded &e{AMOUNT} Coins &ato &e{PLAYER}&a."
  take: "{PREFIX}&cRemoved &e{AMOUNT} Coins &cfrom &e{PLAYER}&c."
  set: "{PREFIX}&aSet &e{PLAYER}'s &abalance to &e{AMOUNT} Coins&a."

  top:
    header: "&8---------------- &bCoins Leaderboard &8----------------"
    entry: "&6#{POSITION} &e{PLAYER} &7- &a{AMOUNT} Coins"
    empty: "{PREFIX}&7No player data found for top coins."
    footer: "&8----------------------------------------"

  help:
    header: "&8---------------- &bCoins Commands &8----------------"
    balance: "&e/coins balance [player] &7- View coin balance"
    pay: "&e/coins pay <player> <amount> &7- Send coins to a player"
    top: "&e/coins top &7- View coin leaderboard"
    give: "&e/coins give <player> <amount> &7- Give coins to a player"
    take: "&e/coins take <player> <amount> &7- Take coins from a player"
    set: "&e/coins set <player> <amount> &7- Set player's coin balance"
    reload: "&e/coins reload &7- Reload all configurations"
    footer: "&8----------------------------------------"

# ClearLag Messages (Using Cleaner Prefix)
clearlag:
  prefix: "&#FF3366&lCLEANER &8▶ "
  warning: "{CLEARLAG_PREFIX}&fDropped entities are clearing in &c{TIME}s."
  complete: "{CLEARLAG_PREFIX}&fDropped entities have been cleared &7(&c{TOTAL} &7removed)."
  cleared-manual: "{CLEARLAG_PREFIX}&aManual cleanup complete: removed &e{TOTAL} &aentities."
  manual-start: "{CLEARLAG_PREFIX}&eExecuting entity cleanup..."
  reload: "{CLEARLAG_PREFIX}&aClearLag configuration reloaded."
  disabled: "{CLEARLAG_PREFIX}&cESCore ClearLag system is currently disabled in config.yml."

  status:
    header: "&8---------------- &bClearLag Status &8----------------"
    next-cleanup: "&7Next cleanup in: &e{TIME} &7seconds"
    interval: "&7Interval: &e{INTERVAL} &7seconds"
    last-removed: "&7Last cleanup removed: &e{TOTAL} &7entities (Items: &e{ITEMS}&7, Mobs: &e{MOBS}&7, Proj: &e{PROJECTILES}&7, XP: &e{XP}&7)"
    status-disabled: "&cClearLag system is currently disabled."
    footer: "&8----------------------------------------"

  help:
    header: "&8---------------- &bClearLag Commands &8----------------"
    clear: "&e/clearlag clear &7- Manually trigger entity removal"
    status: "&e/clearlag status &7- View cleanup timer and statistics"
    reload: "&e/clearlag reload &7- Reload ClearLag settings"
    footer: "&8----------------------------------------"

# Arena Regeneration System Messages
arena:
  wand-given: "{PREFIX}&aYou received the Arena Selection Wand. Left-click for Pos 1, right-click for Pos 2."
  pos1-set: "{PREFIX}&aPosition 1 set to &e{X}, {Y}, {Z} &a({WORLD})."
  pos2-set: "{PREFIX}&aPosition 2 set to &e{X}, {Y}, {Z} &a({WORLD})."
  selection-info: "{PREFIX}&7Cuboid size: &e{SIZE_X}x{SIZE_Y}x{SIZE_Z} &7(&e{BLOCKS} &7blocks)."
  create-usage: "{PREFIX}&cUsage: /arena regen create <arena>"
  save-usage: "{PREFIX}&cUsage: /arena regen <arena> save"
  regen-usage: "{PREFIX}&cUsage: /arena regen regenerate <arena>"
  delete-usage: "{PREFIX}&cUsage: /arena regen delete <arena>"
  created: "{PREFIX}&aArena &e{ARENA} &acreated successfully! &7({BLOCKS} blocks)"
  saving: "{PREFIX}&7Saving snapshot for arena &e{ARENA}&7..."
  saved: "{PREFIX}&aSnapshot for arena &e{ARENA} &asaved successfully! &7({BLOCKS} blocks)"
  regenerating: "{PREFIX}&7Regenerating arena &e{ARENA}&7..."
  regenerated: "{PREFIX}&aArena &e{ARENA} &aregenerated successfully! &7({MODIFIED} blocks changed in {TIME}ms)"
  deleted: "{PREFIX}&aArena &e{ARENA} &adeleted successfully."
  list-header: "&8&m----------------&r &b&lArenas &8&m----------------"
  list-entry: "&e{ARENA} &7- &f{WORLD} &8(&7{SIZE_X}x{SIZE_Y}x{SIZE_Z}&8, &7{BLOCKS} blocks&8) {SNAPSHOT_STATUS}"
  list-empty: "{PREFIX}&7No arenas have been created yet."
  list-footer: "&8----------------------------------------"

  help:
    header: "&8&m----------------&r &b&lArena Commands &8&m----------------"
    wand: "&e/arena regen wand &7- Get the selection wand"
    create: "&e/arena regen create <arena> &7- Create arena from wand selection"
    save: "&e/arena regen <arena> save &7- Save current arena as snapshot"
